[pytest]
addopts = -v --strict-markers --tb=short --color=yes
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Core functionality smoke tests
    regression: Full regression test suite
    auth: Authentication and login tests
    inventory: Product inventory and listing tests
    cart: Shopping cart functionality tests
    checkout: Checkout process tests
    e2e: End-to-end workflow tests
    navigation: Navigation and menu tests
    negative: Negative test cases
    positive: Positive test cases
    slow: Tests that take longer to execute
    critical: Business critical test cases
    ui: UI validation tests
    functional: Functional tests